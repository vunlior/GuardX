warn-packets-failed: "Could not start the packet layer \"{backend}\": {error}"
warn-packets-none: "The packet layer is not running: packet checks (Timer, AutoClicker, Aim, NoSwing, BadPackets, PacketFlood, ActionSpam, KillAura multi-target) are disabled. All other checks work. See the details above; installing PacketEvents may help."
warn-packets-inject: "The built-in packet layer could not attach to player {player}: {error}. Further messages of this kind are suppressed."
warn-packets-action: "The built-in packet layer could not detect the entity interaction type on this server version: hits are not analyzed. Install PacketEvents or report your server version to the author."
warn-decay: "vl-decay-per-10s must be a finite number >= 0."
warn-punish-vl: "punish.vl must be a finite number > 0; check your configuration."
warn-fastbreak: "The fastbreak check is enabled. Make sure to calibrate its thresholds on a test server."
warn-discord-url: "discord.webhook-url is invalid (expected a link like https://discord.com/api/webhooks/...). Discord alerts are disabled."
warn-notify-send: "{name}: failed to send the notification: {error}"

# --- external notifications: Discord / Telegram (plain text; **bold** and `code` are converted) ---
notify-punish-title: "Punishment: {player}"
notify-punish-body: "**Check:** {check}\n**VL:** {vl}\n**Punishments this session:** {count}\n**Command:** `{cmd}`"
notify-report-title: "Report #{id}"
notify-report-body: "**Target:** {target}\n**Reporter:** {reporter}\n**Reason:** {reason}\n**VL:** {vl}\n**Violations:** {snapshot}"
notify-auto-title: "Auto-report: {target}"
notify-auto-body: "**Reason:** {reason}\n**VL:** {vl}\n**Violations:** {snapshot}"
notify-threshold-title: "Report threshold: {player}"
notify-threshold-body: "The player was reported by **{count}** different players."

# --- new in 1.0.0 ---
alert-hover: "&7Click to teleport to &f{player}"
help-exempt: "&e/guardx exempt <player> [minutes|off] &7- temporarily skip a player"
