banner-author: " &7Developer:      &f{value}"
banner-server: " &7Server:         &f{value}"
banner-backend: " &7Packets:         &f{value}"
banner-checks: " &7Checks:         &f{value} &7(Bukkit events)"
banner-packet: " &7Packet layer:   &f{value}"
banner-punish: " &7Punishments:    {value}"
banner-punish-on: "&aenabled"
banner-punish-off: "&edisabled (observe mode)"
banner-hooks: " &7Integrations:   &f{value}"
banner-lang: " &7Language:        &f{value}"
banner-startup: " &7Startup time:   &f{value} ms"
banner-uptime: " &7Uptime:         &f{value}"
banner-cleared: " &7Data cleared:    &f{value} &7players"
uptime-format: "{h}h {m}m {s}s"
warn-packets-off: "Packet layer is disabled (packets.backend: off): Timer, AutoClicker, Aim, NoSwing, BadPackets, PacketFlood, ActionSpam and KillAura multi-target do not work."
warn-packets-pe-missing: "packets.backend is set to packetevents, but the PacketEvents plugin was not found or is not running. Switching to the built-in layer."
