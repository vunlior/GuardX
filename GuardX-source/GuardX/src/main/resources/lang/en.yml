# GuardX — English language file
# Colors: &a &c &e etc. Do not change {placeholders}.
# If a key is missing here, the bundled value is used.

prefix: "&8[&cGuardX&8] "
alert: "&7{player} &fflagged &c{check} &8(&7{info}&8) &fVL: &c{vl}"

# --- general ---
no-permission: "&cYou don't have permission to do that."
reloaded: "&aGuardX config and language file reloaded."
alerts-on: "&aAlerts enabled."
alerts-off: "&eAlerts disabled."
debug-on: "&aDebug mode enabled: you will see every single flag."
debug-off: "&eDebug mode disabled."
debug-line: "&8[DBG] &7{player} &f{check} &8+{add} &7(total &c{total}&7) &8{info}"
player-not-found: "&cPlayer not found."
players-only: "Players only."

# --- reports ---
report-usage: "&eUsage: &f/report <player> <reason>"
report-sent: "&aYour report on &f{player}&a was sent to the moderators. Thank you!"
report-self: "&cYou can't report yourself."
report-cooldown: "&cPlease wait a little before your next report."
report-duplicate: "&eYou already reported this player recently."
report-no-reason: "&cPlease give a reason (for example: killaura, fly)."
report-exempt: "&cThis player can't be reported."
report-closed: "&aYour report on &f{player}&a has been reviewed. Thanks for helping!"
report-new: "&6[Report #{id}] &7{reporter} &f→ &c{target}&f: &e{reason}"
report-auto: "&e[Auto] &7{target} &fhas suspicious VL &8(&7{reason}&8)"
report-threshold: "&c{player} was reported by {count} different players!"
report-hover-reporters: "&7Reports from different players: &f{count}"
report-hover-vl: "&7VL: &c{vl}"
report-hover-none: "no violations found"
report-hover-click: "&8Click to teleport to the player"
auto-reason: "total VL {vl} ({check})"

# --- commands ---
info-title: "&6VL of {player}:"
no-violations: "&a no violations"
inspect-title: "&6GuardX — player analysis: &f{player}"
inspect-vl-none: "&aVL: no active violations"
inspect-open-reports: "&6Open reports: &f{count}"
inspect-suspect: " &c(under increased scrutiny)"
reports-none: "&aNo open reports."
reports-title: "&6Reports ({count}), page {page}/{pages}:"
reports-from: " from "
reports-count: ", reports: {count}"
reports-footer: "&7/guardx close <id|player> — close, /guardx history <player> — recent flags"
close-usage: "&e/guardx close <id|player>"
close-not-found: "&cNo open report found."
close-done: "&aReports closed: {count}"
history-title: "&6Recent violations of {player}:"
goto-done: "&aTeleported to {player}. To spectate: /gamemode spectator"
top-title: "&6GuardX — active VL (online):"
top-none: "&aNo active VL."
reset-done: "&aVL of {player} has been reset."
dump-saved: "&aReport saved: {file}"
dump-failed: "&cCould not save the report. See the console for details."
diag-title: "&6GuardX — diagnostics:"
diag-players: "&7Players: &f{value}"
diag-packets: "&7Packet layer: &f{value}"
diag-checks: "&7Checks: &f{value}"
diag-calls: "&7Move check calls: &f{value}"
diag-avg: "&7Average time: &f{value} µs"
diag-max: "&7Maximum: &f{value} µs"
diag-errors: "&7Check errors: &f{value}"
diag-broken: "&cDisabled due to errors: {value}"
checks-title: "&6GuardX — checks:"
checks-enabled: " ENABLED"
checks-disabled: " DISABLED"

